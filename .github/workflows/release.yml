name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write
  contents: write

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Contract and drift verification
        run: npm run contracts:verify

      - name: Synthetic regression/evaluation suite
        run: npm run eval

      - name: Execute CLI examples and schedule diff
        run: |
          node src/cli.js examples/launch-checklist.md --type markdown --format review > example-review.md
          node src/cli.js examples/status-update.md --type markdown --format markdown > example-status.md
          node src/cli.js diff examples/baseline-plan.json examples/current-plan.json --format json > diff.json
          node src/cli.js diff examples/baseline-plan.json examples/current-plan.json --format markdown > diff.md
          test -s example-review.md
          test -s example-status.md
          test -s diff.json
          test -s diff.md
          grep -q "Critical path is not computed" diff.md

      - name: Package dry run
        run: npm pack --dry-run

  publish:
    name: Publish to npm with provenance
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22 with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Clean install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "timeline-truth v${VERSION}" \
            --notes "See CHANGELOG.md for v${VERSION}."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
