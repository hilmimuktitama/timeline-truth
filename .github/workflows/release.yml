name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to verify and publish (for example, v0.3.0)
        required: true
        type: string

permissions:
  id-token: write
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.release.tag_name }}

jobs:
  verify:
    name: Verify before publishing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Verify exact release tag and package version
        run: |
          test -n "$RELEASE_TAG"
          case "$RELEASE_TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "Invalid release tag: $RELEASE_TAG"; exit 1 ;; esac
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          test "$(node -p "require('./package.json').version")" = "${RELEASE_TAG#v}"

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup npm 12.0.2 for trusted publishing
        run: |
          npm install --global npm@12.0.2
          npm --version
          test "$(npm --version)" = "12.0.2"

      - name: Clean install
        run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Tests
        run: npm test

      - name: Syntax check
        run: npm run check

      - name: Contract and drift verification
        run: npm run contracts:verify

      - name: Synthetic regression/evaluation suite
        run: npm run eval

      - name: Execute CLI examples and schedule diff
        run: |
          node src/cli.js examples/launch-checklist.md --type markdown --format review > example-review.md
          node src/cli.js examples/status-update.md --type markdown --format markdown > example-status.md
          node src/cli.js diff examples/baseline-plan.json examples/current-plan.json --format json > diff.json
          node src/cli.js diff examples/baseline-plan.json examples/current-plan.json --format markdown > diff.md
          test -s example-review.md
          test -s example-status.md
          test -s diff.json
          test -s diff.md
          grep -q "Critical path is not computed" diff.md

      - name: Package dry run
        run: npm pack --dry-run

  publish:
    name: Publish to npm with provenance
    needs: verify
    runs-on: ubuntu-latest
    environment: npm-publish
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Setup Node.js 22 with npm registry
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Setup npm 12.0.2 for trusted publishing
        run: |
          npm install --global npm@12.0.2
          npm --version
          test "$(npm --version)" = "12.0.2"

      - name: Clean install
        run: npm ci

      - name: Publish
        run: npm publish --provenance --access public
